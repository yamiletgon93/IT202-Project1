<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving On Up | Representative Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-panel">
    <h1>Moving On Up</h1>
    <!-- JavaScript handles validation and verification without sending form data. -->
    <form id="representative-form" action="#" method="post" autocomplete="off">
      <div class="field">
        <label for="first-name">Moving Rep's First Name:</label>
        <div class="input-row">
          <input type="text" id="first-name" name="firstName" placeholder="First name" aria-describedby="first-name-note">
          <span class="field-note" id="first-name-note">REQUIRED</span>
        </div>
      </div>
      <div class="field">
        <label for="last-name">Moving Rep's Last Name:</label>
        <div class="input-row">
          <input type="text" id="last-name" name="lastName" placeholder="Last name" aria-describedby="last-name-note">
          <span class="field-note" id="last-name-note">REQUIRED</span>
        </div>
      </div>
      <div class="field">
        <label for="password">Moving Rep's Password:</label>
        <div class="input-row">
          <div class="password-control">
            <input type="password" id="password" name="password" placeholder="Password" aria-describedby="password-note">
            <button type="button" id="password-toggle" name="passwordToggle" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
            </button>
          </div>
          <span class="field-note" id="password-note">REQUIRED</span>
        </div>
      </div>
      <div class="field">
        <label for="representative-id">Moving Rep's ID #:</label>
        <div class="input-row">
          <input type="text" id="representative-id" name="representativeId" placeholder="4-digit ID" aria-describedby="id-note">
          <span class="field-note" id="id-note">REQUIRED</span>
        </div>
      </div>
      <div class="field">
        <label for="phone">Moving Rep's Phone #:</label>
        <div class="input-row">
          <input type="text" id="phone" name="phone" placeholder="201-555-0123 ext. 101" aria-describedby="phone-note">
          <span class="field-note" id="phone-note">REQUIRED</span>
        </div>
      </div>
      <div class="field">
        <label for="email">Moving Rep's Email:</label>
        <div class="input-row">
          <input type="text" id="email" name="email" placeholder="name@example.com" aria-describedby="email-note">
          <span class="field-note email-note" id="email-note">IF REQUESTED</span>
        </div>
      </div>
      <div class="confirmation">
        <input type="checkbox" id="email-confirmation" name="emailConfirmation" value="yes">
        <label for="email-confirmation">Check the box to request an Email Confirmation:</label>
      </div>
      <div class="bottom-row">
        <div class="transaction-field">
          <label for="transaction">Select a Transaction:</label>
          <select id="transaction" name="transaction">
            <option value="search">Search A Moving Representative's Accounts</option>
            <option value="book">Book a Client's Moving Event</option>
            <option value="cancel">Cancel A Client's Moving Event</option>
            <option value="services">Request Moving Services</option>
            <option value="additional-services">Request Additional Moving Services</option>
            <option value="new-client">Create A New Client Account</option>
          </select>
        </div>
        <div class="form-actions">
          <input type="submit" id="submit-button" name="submitButton" value="Submit">
          <input type="reset" id="reset-button" name="resetButton" value="Reset">
        </div>
      </div>
    </form>
  </main>
</body>
</html>
